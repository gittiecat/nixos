################
### MONITORS ###
################

# See https://wiki.hyprland.org/Configuring/Monitors/
monitor=DP-1,3840x2160@240,0x0,1.5,bitdepth,10,cm,wide,vrr,2
workspace = 1, monitor:DP-1, default:true, persistent:true
workspace = 4, monitor:DP-1, persistent:true

monitor=HDMI-A-1,1920x1080@60,-1920x180,1
# monitor=HDMI-A-1,disable
workspace = 3, monitor:HDMI-A-1, persistent:true
workspace = 5, monitor:HDMI-A-1
workspace = 6, monitor:HDMI-A-1

monitor=DP-3,1920x1080@60,2560x-240,1,transform,3
workspace = 2, monitor:DP-3, persistent:true, layoutopt:orientation:top

###################
### MY PROGRAMS ###
###################

# See https://wiki.hyprland.org/Configuring/Keywords/

# Set programs that you use
$terminal = kitty
$fileManager = dolphin
$menu = pkill wofi || wofi --show drun -n
$obs = obs --disable-shutdown-check --startreplaybuffer --profile MainScreenReplayBuffer
$discord = vesktop --enable-features=UseOzonePlatform --ozone-platform=wayland

#################
### AUTOSTART ###
#################

exec-once = nm-applet & hyprpaper & 
exec-once = [workspace 2 silent] $discord &
# Delayed: steam targets workspace 3 (on HDMI-A-1), which the DSC workaround
# below disables/re-enables at t+3..5s. Launching steam mid-bootstrap while its
# output is yanked makes it fail to start, so wait until the toggle has settled.
exec-once = sleep 8 && hyprctl dispatch exec "[workspace 3 silent] steam"
exec-once = [workspace 5 silent] easyeffects & $obs &
exec-once = xwaylandvideobridge &
exec-once = mako &
# Workaround: at boot, DP-1 (4K@240 10-bit) fails to negotiate DSC and caps at
# 144Hz. Toggling the side monitor off/on frees the link so DP-1 picks up DSC
# (->240Hz) and repositions HDMI-A-1 correctly. Tune the sleeps if it's flaky.
exec-once = sleep 3 && hyprctl keyword monitor "HDMI-A-1,disable" && sleep 2 && hyprctl keyword monitor "HDMI-A-1,1920x1080@60,-1920x180,1"
# exec-once = swayidle -w timeout 1800 'pidof swaylock || lock'


#############################
### ENVIRONMENT VARIABLES ###
#############################

# See https://wiki.hyprland.org/Configuring/Environment-variables/

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = LIBVA_DRIVER_NAME,nvidia
env = GBM_BACKEND,nvidia-drm
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
env = WLR_DRM_DEVICES,/dev/dri/by-name/nvidia
env = XDG_SESSION_TYPE,wayland
env = NVD_BACKEND,direct
env = HYPRLAND_LOG_WLR,1
env = __GL_VRR_ALLOWED,0
env = __GL_GSYNC_ALLOWED,1
env = GDK_SCALE,2
env = QT_AUTO_SCREEN_SCALE_FACTOR,1
env = QT_SCALE_FACTOR,1


#################
### ECOSYSTEM ###
#################

# Disable the periodic "Support Hyprland" donation popup (hyprland-donate-screen)
# and the update-news popup. https://wiki.hyprland.org/Configuring/Variables/#ecosystem
ecosystem {
    no_donation_nag = true
    no_update_news = true
}


#####################
### LOOK AND FEEL ###
#####################

# Refer to https://wiki.hyprland.org/Configuring/Variables/

# https://wiki.hyprland.org/Configuring/Variables/#general
general {
    gaps_in = 5
    gaps_out = 20

    border_size = 2

    # https://wiki.hyprland.org/Configuring/Variables/#variable-types for info about colors
    col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
    col.inactive_border = rgba(595959aa)

    # Set to true enable resizing windows by clicking and dragging on borders and gaps
    resize_on_border = false

    # Please see https://wiki.hyprland.org/Configuring/Tearing/ before you turn this on
    allow_tearing = true

    layout = dwindle
}

cursor {
    no_hardware_cursors = true
}

render {
    cm_enabled = false
    direct_scanout = 0
}

opengl {
  nvidia_anti_flicker = true
}

# https://wiki.hyprland.org/Configuring/Variables/#decoration
decoration {
    rounding = 7

    # Change transparency of focused and unfocused windows
    active_opacity = 1.0
    inactive_opacity = 1.0

    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }

    # https://wiki.hyprland.org/Configuring/Variables/#blur
    blur {
        enabled = false
        size = 3
        passes = 1

        vibrancy = 0.1696
    }

    dim_inactive = false
    dim_strength = 0.0
}


# https://wiki.hyprland.org/Configuring/Variables/#animations
animations {
    enabled = yes

    # Default animations, see https://wiki.hyprland.org/Configuring/Animations/ for more

    bezier = easeOutQuint,0.23,1,0.32,1
    bezier = easeInOutCubic,0.65,0.05,0.36,1
    bezier = linear,0,0,1,1
    bezier = almostLinear,0.5,0.5,0.75,1.0
    bezier = quick,0.15,0,0.1,1

    animation = global, 1, 10, default
    animation = border, 1, 5.39, easeOutQuint
    animation = windows, 1, 4.79, easeOutQuint
    animation = windowsIn, 1, 4.1, easeOutQuint, popin 87%
    animation = windowsOut, 1, 1.49, linear, popin 87%
    animation = fadeIn, 1, 1.73, almostLinear
    animation = fadeOut, 1, 1.46, almostLinear
    animation = fade, 1, 3.03, quick
    animation = layers, 1, 3.81, easeOutQuint
    animation = layersIn, 1, 4, easeOutQuint, fade
    animation = layersOut, 1, 1.5, linear, fade
    animation = fadeLayersIn, 1, 1.79, almostLinear
    animation = fadeLayersOut, 1, 1.39, almostLinear
    animation = workspacesIn, 1, 1.21, almostLinear, fade
    animation = workspacesOut, 1, 1.94, almostLinear, fade

    animation = specialWorkspace, 1, 6, default, slidevert
    animation = workspaces, 1, 6, default, slide
}

# Ref https://wiki.hyprland.org/Configuring/Workspace-Rules/
windowrule = match:content game, immediate on, fullscreen on, stay_focused on, render_unfocused on, workspace 4

windowrule = match:class vesktop, workspace 2 silent
windowrule = match:class steam, workspace 3 silent
windowrule = match:class com.github.wwmm.easyeffects, workspace 5 silent
windowrule = match:class com.obsproject.Studio, workspace 5 silent

windowrule = match:initial_class ^steam.+$, content game

windowrule = match:class Buckshot, fullscreen true, workspace 4
windowrule = match:initial_class org.prismlauncher.PrismLauncher, workspace 3
windowrule = match:initial_class ^Minecraft.+$, content game
windowrule = match:class bg3, fullscreen true, workspace 4
windowrule = match:class BattleBit, fullscreen true, workspace 4, stay_focused true
windowrule = match:class Crysis, fullscreen true, workspace 4, stay_focused true
windowrule = match:initial_class ^Project.*$, fullscreen true, workspace 4, stay_focused true
windowrule = match:initial_class ^Slay.*$, fullscreen true, workspace 4, stay_focused true
windowrule = match:class cavafloat, float true, pin true, stay_focused true, no_blur true, no_focus true, move 200 13, size 235 27, workspace 2

windowrule = match:initial_class ^code$, opacity 0.96
windowrule = match:class ^.*xwaylandvideobridge.*$, no_initial_focus on, no_focus on, no_anim on, no_blur on, max_size 1 1, opacity 0.0
windowrule = match:initial_class ^.*share$, fullscreen_state 0 0

xwayland {
    force_zero_scaling = true
}

# See https://wiki.hyprland.org/Configuring/Dwindle-Layout/ for more
dwindle {
    # pseudotile = true # Master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
    preserve_split = true # You probably want this
}

# See https://wiki.hyprland.org/Configuring/Master-Layout/ for more
master {
    new_status = master
    new_on_top = true
    mfact = 0.55
}

# https://wiki.hyprland.org/Configuring/Variables/#misc
misc {
    force_default_wallpaper = 0 # Set to 0 or 1 to disable the anime mascot wallpapers
    disable_hyprland_logo = false # If true disables the random hyprland logo / anime girl background. :(
    vrr = 1
}


#############
### INPUT ###
#############

# https://wiki.hyprland.org/Configuring/Variables/#input
input {
    kb_layout = us,ru
    kb_variant =
    kb_model =
    kb_options = grp:alt_shift_toggle
    kb_rules =

    follow_mouse = 2

    sensitivity = -1.0 # -1.0 - 1.0, 0 means no modification.

}

# Example per-device config
# See https://wiki.hyprland.org/Configuring/Keywords/#per-device-input-configs for more
device {
    name = epic-mouse-v1
    sensitivity = -0.5
}


###################
### KEYBINDINGS ###
###################

# See https://wiki.hyprland.org/Configuring/Keywords/
$mainMod = SUPER # Sets "Windows" key as main modifier

# Example binds, see https://wiki.hyprland.org/Configuring/Binds/ for more
bind = $mainMod, Q, exec, kitty -1
bind = $mainMod, C, killactive,
bind = $mainMod SHIFT, M, exit,
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, V, togglefloating
bind = $mainMod, P, pseudo, # dwindle
# bind = $mainMod, J, togglesplit, # dwindle
bind = $mainMod, $mainMod_L, exec, $menu
bind = $mainMod, L, exec, lock
bind = $mainMod SHIFT, C, exec, pkill waybar; waybar
bind = $mainMod SHIFT, X, exec, hyprctl reload && notify-send "Reloaded Hyprland"
bind = $mainMod SHIFT, D, exec, show-desktop
bindr = $mainMod SHIFT, D, exec, show-desktop
bind = SHIFT, F9, pass, class:^(com\.obsproject\.Studio)$
bind = SHIFT, F8, pass, class:^(com\.obsproject\.Studio)$
bind = , F9, pass, class:^(com\.obsproject\.Studio)$

# Move focus with mainMod + arrow keys
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move tiles with mainMod + Alt + arrow keys
bind = $mainMod&Alt, up, movewindow, u
bind = $mainMod&Alt, right, movewindow, r
bind = $mainMod&Alt, left, movewindow, l
bind = $mainMod&Alt, down, movewindow, d

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Example special workspace (scratchpad)
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod Alt, S, movetoworkspace, special:magic

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
# bindm = , mouse:274, movewindow
bindm = $mainMod, mouse:273, resizewindow
bind = $mainMod, F, fullscreenstate, 2 0

# hyprshot
bind = $mainMod SHIFT, S, exec, hyprshot -m region --clipboard-only
bind = $mainMod SHIFT, Z, exec, grim - | wl-copy
bind = $mainMod SHIFT, A, exec, hyprshot -m output -m DP-1 --clipboard-only

# Requires playerctl
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl = , code:191, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle; pkill -RTMIN+8 waybar
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-

##############################
### WINDOWS AND WORKSPACES ###
##############################

# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more
# See https://wiki.hyprland.org/Configuring/Workspace-Rules/ for workspace rules

# Ignore maximize requests from apps. You'll probably like this.
windowrule = match:class .*, suppress_event maximize

# Fix some dragging issues with XWayland
windowrule = match:class ^$, no_focus true, fullscreen false, pin false

exec-once=bash ~/.config/hypr/start.sh
exec-once=dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
